name: 実行用

on:
  repository_dispatch:
    types: [my-cron-event] 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scratchattach

      - name: Run script
        env:
          SCRATCH_PASSWORD: ${{ secrets.SCRATCH_PASSWORD }}
          SCRATCH_USERNAME: ${{ secrets.SCRATCH_USERNAME }}
        run: python main.py
        
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"


      - name: Commit and push changes
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update by Python script" && git push)
